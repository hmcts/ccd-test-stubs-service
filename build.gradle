buildscript {
    dependencies {
        classpath localGroovy()
    }
}

plugins {
  id 'application'
  id 'jacoco'
  id 'com.github.ben-manes.versions' version '0.61.0'
  id 'io.spring.dependency-management' version '1.1.7'
  id 'org.owasp.dependencycheck' version '13.0.0'
  id 'org.sonarqube' version '7.5.0.8588'
  id 'org.springframework.boot' version '3.5.16'
  id 'uk.gov.hmcts.java' version '0.12.70'
}

group = 'uk.gov.hmcts.reform.ccd'

java {
  toolchain {
    languageVersion = JavaLanguageVersion.of(21)
  }
}

sourceSets {
  integrationTest {
    java {
      compileClasspath += main.output
      runtimeClasspath += main.output
      srcDir file('src/integrationTest/java')
    }
    resources.srcDir file('src/integrationTest/resources')
  }

  smokeTest {
    java {
      compileClasspath += main.output
      runtimeClasspath += main.output
      srcDir file('src/smokeTest/java')
    }
    resources.srcDir file('src/smokeTest/resources')
  }

  functionalTest {
    java {
      compileClasspath += main.output
      runtimeClasspath += main.output
      srcDir file('src/functionalTest/java')
    }
    resources.srcDir file('src/functionalTest/resources')
  }
}

configurations {

  integrationTestImplementation.extendsFrom testImplementation
  integrationTestRuntimeOnly.extendsFrom testRuntimeOnly
  smokeTestImplementation.extendsFrom testImplementation
  smokeTestRuntimeOnly.extendsFrom testRuntimeOnly
  functionalTestImplementation.extendsFrom testImplementation
  functionalTestRuntimeOnly.extendsFrom testRuntimeOnly
}

tasks.withType(JavaCompile) {
  options.compilerArgs << "-Xlint:unchecked" << "-Werror"
}

tasks.withType(Test) {
  failFast = true
  useJUnitPlatform()

  testLogging {
    exceptionFormat = 'full'
  }
}

task integration(type: Test, description: 'Runs the integration tests.', group: 'Verification') {
  testClassesDirs = sourceSets.integrationTest.output.classesDirs
  classpath = sourceSets.integrationTest.runtimeClasspath

  // set your environment variables here
  environment("WIREMOCK_SERVER_MAPPINGS_PATH", "wiremock")
}

task smoke(type: Test) {
  failFast = false
  testClassesDirs = sourceSets.smokeTest.output.classesDirs
  classpath = sourceSets.smokeTest.runtimeClasspath
  useJUnitPlatform {
    includeTags 'smoke'
  }
}

task functional(type: Test) {
  failFast = false
  testClassesDirs = sourceSets.functionalTest.output.classesDirs
  classpath = sourceSets.functionalTest.runtimeClasspath
  useJUnitPlatform {
    includeTags 'functional'
  }
}

jacocoTestReport {
  executionData(test, integration)
  reports {
    xml.required = true
    csv.required = false
    xml.outputLocation = file("${buildDir}/reports/jacoco/test/jacocoTestReport.xml")
  }
}

check.dependsOn integration

project.tasks['sonarqube'].dependsOn test, integration, jacocoTestReport

sonarqube {
  properties {
    property "sonar.projectName", "Reform :: ccd-test-stubs-service"
    property "sonar.projectKey", "uk.gov.hmcts.reform:ccd-test-stubs-service"
    property "sonar.jacoco.reportPaths", "${project.buildDir}/jacoco/test.exec"
    property "sonar.jacoco.itReportPath", "${project.buildDir}/jacoco/integration.exec"
    property "sonar.junit.reportPaths", "${project.buildDir}/test-results/junit-platform"
    property "sonar.coverage.jacoco.xmlReportPaths", "${jacocoTestReport.reports.xml.outputLocation}"
  }
}

dependencyUpdates.resolutionStrategy = {
  componentSelection { rules ->
    rules.all { ComponentSelection selection ->
      boolean rejected = ['alpha', 'beta', 'rc', 'cr', 'm'].any { qualifier ->
        selection.candidate.version ==~ /(?i).*[.-]${qualifier}[.\d-]*/
      }
      if (rejected) {
        selection.reject('Release candidate')
      }
    }
  }
}

apply from: './gradle/suppress.gradle'
dependencyCheck {
  suppressionFile = 'dependency-check-suppressions.xml'
  if (project.hasProperty('dependencyCheck.autoUpdate')) {
    autoUpdate = project.property('dependencyCheck.autoUpdate').toString().toBoolean()
  }
}

repositories {
  mavenLocal()
  mavenCentral()
  maven {
    name = "AzureArtifacts"
    url = uri("https://pkgs.dev.azure.com/hmcts/Artifacts/_packaging/hmcts-lib/maven/v1")
  }
}

ext {
  set('springBootVersion', '3.5.16')
  set('commons-lang3.version', '3.21.0')
  set('log4j2.version', '2.26.1')
  set('snakeyaml.version', '2.5')
  set('httpcore5.version', '5.4.3')
  set('json-path.version', '2.10.0')
  set('tomcat.version', '10.1.60')
  set('xmlunit2.version', '2.11.0')
  groovyVersion = '5.1.3'
  jettyVersion = '12.1.12'
  reformLogging = '8.0.0'
  tomcatVersion = '10.1.60'
  // test versions
  junit = '6.1.3'
  junitPlatform = '6.1.3'
  restAssuredVersion = '5.5.7'
}

ext.libraries = [
  junit6: [
    "org.junit.jupiter:junit-jupiter-api:${junit}",
    "org.junit.jupiter:junit-jupiter-engine:${junit}",
    "org.junit.jupiter:junit-jupiter-params:${junit}",
    "org.junit.platform:junit-platform-launcher:${junitPlatform}",
    "org.junit.platform:junit-platform-commons:${junitPlatform}",
    "org.junit.platform:junit-platform-engine:${junitPlatform}",
    "org.apiguardian:apiguardian-api:1.1.2"
  ]
]

dependencyManagement {
  imports {
    mavenBom "org.springframework.boot:spring-boot-dependencies:${springBootVersion}"
  }
}

dependencies {

  implementation platform("org.springframework.boot:spring-boot-dependencies:${springBootVersion}")
  implementation platform("org.eclipse.jetty.ee10:jetty-ee10-bom:12.1.12")
  testImplementation platform("org.springframework.boot:spring-boot-dependencies:${springBootVersion}")
  testImplementation platform("org.eclipse.jetty.ee10:jetty-ee10-bom:12.1.12")

  // start::CVE Vulnerability dependency overrides                                                        // MAIN PARENT DEPENDEDNCY

  constraints {
    implementation("org.apache.tomcat.embed:tomcat-embed-core:${tomcatVersion}") {
      because 'resolves Tomcat CVEs reported against the Spring Boot managed version'
    }
    implementation("org.apache.tomcat.embed:tomcat-embed-el:${tomcatVersion}") {
      because 'keeps embedded Tomcat modules aligned'
    }
    implementation("org.apache.tomcat.embed:tomcat-embed-websocket:${tomcatVersion}") {
      because 'resolves Tomcat CVEs reported against the Spring Boot managed version'
    }
    implementation('org.apache.commons:commons-lang3:3.21.0') {
      because 'resolves Commons Lang CVEs from transitive dependencies'
    }
  }

  // end::CVE Vulnerability dependency overrides                                                          // MAIN PARENT DEPENDEDNCY

  // SPRING
  implementation group: 'org.springframework.boot', name: 'spring-boot-starter'
  implementation group: 'org.springframework.boot', name: 'spring-boot-starter-web'
  implementation group: 'org.springframework.boot', name: 'spring-boot-starter-actuator'
  implementation group: 'org.springframework.boot', name: 'spring-boot-starter-json'

  // HMCTS
  implementation group: 'com.github.hmcts.java-logging', name: 'logging', version: reformLogging

  implementation group: 'com.nimbusds', name: 'nimbus-jose-jwt', version: '10.10'
  implementation group: 'commons-beanutils', name: 'commons-beanutils', version: '1.11.0'
  implementation group: 'jakarta.el', name: 'jakarta.el-api', version: '6.0.1'
  implementation group: 'net.minidev', name: 'json-smart', version: '2.6.0'
  implementation group: 'org.apache.httpcomponents.client5', name: 'httpclient5', version: '5.6.4'
  implementation group: 'org.apache.groovy', name: 'groovy-json', version: groovyVersion
  implementation group: 'org.apache.groovy', name: 'groovy', version: groovyVersion
  implementation group: 'org.apache.groovy', name: 'groovy-xml', version: groovyVersion
  implementation group: 'com.github.ben-manes.caffeine', name: 'caffeine', version: '3.3.0'
  implementation group: 'org.wiremock.integrations', name: 'wiremock-spring-boot', version: '4.4.2'

  testImplementation(enforcedPlatform("org.junit:junit-bom:${junit}"))
  testImplementation libraries.junit6
  testImplementation group: 'org.springframework.boot', name: 'spring-boot-starter-test'
  testImplementation group: 'io.rest-assured', name: 'rest-assured', version: restAssuredVersion
  testImplementation group: 'io.rest-assured', name: 'json-path', version: restAssuredVersion
  testImplementation group: 'io.rest-assured', name: 'xml-path', version: restAssuredVersion

  testImplementation group: 'com.github.hmcts', name: 'fortify-client', version: '1.4.10', classifier: 'all'

  integrationTestImplementation sourceSets.main.runtimeClasspath
  integrationTestImplementation sourceSets.test.runtimeClasspath

  smokeTestImplementation sourceSets.main.runtimeClasspath
  smokeTestImplementation sourceSets.test.runtimeClasspath

  functionalTestImplementation sourceSets.main.runtimeClasspath
  functionalTestImplementation sourceSets.test.runtimeClasspath
}

application {
  mainClass = 'uk.gov.hmcts.reform.ccd.test.stubs.service.Application'
}

bootJar {
  archiveFileName = 'ccd-test-stubs-service.jar'

  manifest {
    attributes('Implementation-Title': project.name)
    attributes('Implementation-Version': project.version.toString())
  }
  from('wiremock/mappings') {
    into 'wiremock/mappings'
  }
}

// for cnp pipeline
task dependencyCheck(dependsOn: dependencyCheckAnalyze)

task fortifyScan(type: JavaExec)  {
  mainClass = "uk.gov.hmcts.fortifyclient.FortifyClientMainApp"
  classpath += sourceSets.test.runtimeClasspath
  jvmArgs = ['--add-opens=java.base/java.lang.reflect=ALL-UNNAMED']
}
